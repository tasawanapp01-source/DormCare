name: DormCare Scheduled 365-Day Data Cleanup

on:
  schedule:
    # Runs daily at 00:00 Bangkok Time (UTC 17:00)
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (Scan only, do not delete)?'
        required: false
        default: 'false'
        type: boolean

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install --no-audit
          else
            npm install --no-audit
          fi

      - name: Run Cleanup Script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/cleanup-expired-data.ts --dry-run
          else
            npx tsx scripts/cleanup-expired-data.ts
          fi
